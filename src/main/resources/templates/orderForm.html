<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Order Form</title>
</head>

<body>

<form method="POST"
      th:action="@{/orders}"
      th:object="${tacoOrder}">

    <div>
        <h3>Deliver my taco masterpiece to...</h3>

        <label for="deliveryName">Name: </label>
        <input id="deliveryName"
               type="text"
               th:field="*{deliveryName}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('deliveryName')}"
              th:errors="*{deliveryName}">
            Name Error
        </span>


        <label for="deliveryStreet">Street address: </label>
        <input id="deliveryStreet"
               type="text"
               th:field="*{deliveryStreet}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('deliveryStreet')}"
              th:errors="*{deliveryStreet}">
            Street Error
        </span>


        <label for="deliveryCity">City: </label>
        <input id="deliveryCity"
               type="text"
               th:field="*{deliveryCity}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('deliveryCity')}"
              th:errors="*{deliveryCity}">
            City Error
        </span>


        <label for="deliveryState">State: </label>
        <input id="deliveryState"
               type="text"
               th:field="*{deliveryState}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('deliveryState')}"
              th:errors="*{deliveryState}">
            State Error
        </span>


        <label for="deliveryZip">Zip code: </label>
        <input id="deliveryZip"
               type="text"
               th:field="*{deliveryZip}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('deliveryZip')}"
              th:errors="*{deliveryZip}">
            Zip Error
        </span>

    </div>


    <div>
        <h3>Here's how I'll pay...</h3>

        <label for="ccNumber">Credit Card #: </label>
        <input id="ccNumber"
               type="text"
               th:field="*{ccNumber}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('ccNumber')}"
              th:errors="*{ccNumber}">
            CC Num Error
        </span>


        <label for="ccExpiration">Expiration: </label>
        <input id="ccExpiration"
               type="text"
               th:field="*{ccExpiration}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('ccExpiration')}"
              th:errors="*{ccExpiration}">
            Expiration Error
        </span>


        <label for="ccCVV">CVV: </label>
        <input id="ccCVV"
               type="text"
               th:field="*{ccCVV}"/>

        <span class="validationError"
              th:if="${#fields.hasErrors('ccCVV')}"
              th:errors="*{ccCVV}">
            CVV Error
        </span>

    </div>

    <button type="submit">Submit order</button>

</form>

</body>
</html>
