
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taco Cloud</title>

    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>

<body>

<div class="page-container">

    <header class="header">
        <img th:src="@{/images/TacoCloud.png}"
             alt="Taco Cloud Logo"
             class="logo">

        <h1>Design Your Taco 🌮</h1>
        <p>Create your perfect taco with your favorite ingredients.</p>
    </header>


    <form method="POST"
          th:object="${taco}"
          class="taco-form">

        <div class="grid">

            <!-- Wrap -->
            <div class="ingredient-group">

                <h3>🌯 Choose your wrap</h3>

                <div class="ingredient-list"
                     th:each="ingredient : ${wrap}">

                    <label class="ingredient-option">

                        <input th:field="*{ingredients}"
                               type="checkbox"
                               th:value="${ingredient.id}"/>

                        <span th:text="${ingredient.name}">
                            INGREDIENT
                        </span>

                    </label>

                </div>
            </div>


            <!-- Protein -->
            <div class="ingredient-group">

                <h3>🥩 Pick your protein</h3>

                <div class="ingredient-list"
                     th:each="ingredient : ${protein}">

                    <label class="ingredient-option">

                        <input th:field="*{ingredients}"
                               type="checkbox"
                               th:value="${ingredient.id}"/>

                        <span th:text="${ingredient.name}">
                            INGREDIENT
                        </span>

                    </label>

                </div>
            </div>


            <!-- Cheese -->
            <div class="ingredient-group">

                <h3>🧀 Choose your cheese</h3>

                <div class="ingredient-list"
                     th:each="ingredient : ${cheese}">

                    <label class="ingredient-option">

                        <input th:field="*{ingredients}"
                               type="checkbox"
                               th:value="${ingredient.id}"/>

                        <span th:text="${ingredient.name}">
                            INGREDIENT
                        </span>

                    </label>

                </div>
            </div>


            <!-- Veggies -->
            <div class="ingredient-group">

                <h3>🥬 Add your veggies</h3>

                <div class="ingredient-list"
                     th:each="ingredient : ${veggies}">

                    <label class="ingredient-option">

                        <input th:field="*{ingredients}"
                               type="checkbox"
                               th:value="${ingredient.id}"/>

                        <span th:text="${ingredient.name}">
                            INGREDIENT
                        </span>

                    </label>

                </div>
            </div>


            <!-- Sauce -->
            <div class="ingredient-group">

                <h3>🌶️ Select your sauce</h3>

                <div class="ingredient-list"
                     th:each="ingredient : ${sauce}">

                    <label class="ingredient-option">

                        <input th:field="*{ingredients}"
                               type="checkbox"
                               th:value="${ingredient.id}"/>

                        <span th:text="${ingredient.name}">
                            INGREDIENT
                        </span>

                    </label>

                </div>
            </div>

        </div>


        <!-- Taco Name -->

        <div class="taco-name-section">

            <h3>Name your taco creation</h3>

            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter your taco name..."
                   class="taco-name-input"/>

            <button type="submit">
                Create My Taco 🌮
            </button>

        </div>

    </form>

</div>

</body>
</html>
